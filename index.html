<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intouch Delivery - สั่งอาหารเดลิเวอรี</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-28">

  <!-- Header -->
  <header class="bg-emerald-600 text-white p-4 sticky top-0 z-10 shadow-md flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold">Intouch Delivery</h1>
      <p class="text-xs text-emerald-100">สั่งอาหารอร่อย ส่งตรงถึงบ้านคุณ</p>
    </div>
    <button onclick="openCart()" class="relative bg-emerald-700 px-3 py-2 rounded-full text-sm font-bold flex items-center gap-1 text-white">
      🛒 ตะกร้า <span id="cart-badge" class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full hidden">0</span>
    </button>
  </header>

  <!-- Menu List -->
  <main class="p-4 max-w-xl mx-auto space-y-3">
    <h2 class="text-lg font-bold text-gray-700 mb-2">รายการอาหารทั้งหมด</h2>
    
    <!-- Item 1 -->
    <div class="bg-white p-3 rounded-xl shadow-sm border flex justify-between items-center">
      <div>
        <h3 class="font-bold text-gray-800">กะเพราหมูสับไข่ดาว</h3>
        <p class="text-emerald-600 font-bold text-sm">65 บาท</p>
      </div>
      <button onclick="addToCart('กะเพราหมูสับไข่ดาว', 65)" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">เพิ่ม</button>
    </div>

    <!-- Item 2 -->
    <div class="bg-white p-3 rounded-xl shadow-sm border flex justify-between items-center">
      <div>
        <h3 class="font-bold text-gray-800">ข้าวผัดต้มยำกุ้ง</h3>
        <p class="text-emerald-600 font-bold text-sm">89 บาท</p>
      </div>
      <button onclick="addToCart('ข้าวผัดต้มยำกุ้ง', 89)" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">เพิ่ม</button>
    </div>

    <!-- Item 3 -->
    <div class="bg-white p-3 rounded-xl shadow-sm border flex justify-between items-center">
      <div>
        <h3 class="font-bold text-gray-800">ข้าวหมูกระเทียม</h3>
        <p class="text-emerald-600 font-bold text-sm">60 บาท</p>
      </div>
      <button onclick="addToCart('ข้าวหมูกระเทียม', 60)" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">เพิ่ม</button>
    </div>

    <!-- Item 4 -->
    <div class="bg-white p-3 rounded-xl shadow-sm border flex justify-between items-center">
      <div>
        <h3 class="font-bold text-gray-800">ชาไทยเย็น</h3>
        <p class="text-emerald-600 font-bold text-sm">35 บาท</p>
      </div>
      <button onclick="addToCart('ชาไทยเย็น', 35)" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">เพิ่ม</button>
    </div>
  </main>

  <!-- Bottom Cart Bar -->
  <div id="bottom-bar" class="hidden fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-lg flex justify-between items-center max-w-xl mx-auto z-20">
    <div>
      <p class="text-xs text-gray-500">ยอดรวม</p>
      <p id="total-price" class="text-xl font-bold text-emerald-600">0 ฿</p>
    </div>
    <button onclick="openCart()" class="bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold shadow-md">
      ดูตะกร้าสินค้า 🛒
    </button>
  </div>

  <!-- Cart Modal -->
  <div id="cart-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex justify-end">
    <div class="bg-white w-full max-w-md h-full flex flex-col justify-between p-4">
      <div>
        <div class="flex justify-between items-center border-b pb-3 mb-4">
          <h2 class="text-lg font-bold">ตะกร้าสินค้าของคุณ</h2>
          <button onclick="closeCart()" class="text-gray-500 text-xl font-bold">✕</button>
        </div>
        <div id="cart-items" class="space-y-2 max-h-[50vh] overflow-y-auto"></div>
        
        <div class="mt-4">
          <label class="text-xs font-semibold text-gray-600 block mb-1">หมายเหตุเพิ่มเติม:</label>
          <input id="note-text" type="text" placeholder="เช่น เผ็ดน้อย, ไม่ใส่ผัก" class="w-full border rounded-lg p-2 text-sm">
        </div>
      </div>

      <div class="border-t pt-4">
        <div class="flex justify-between text-lg font-bold mb-4">
          <span>รวมทั้งหมด:</span>
          <span id="modal-total" class="text-emerald-600">0 ฿</span>
        </div>
        <button onclick="sendToLine()" class="w-full bg-emerald-500 text-white py-3 rounded-xl font-bold text-center block shadow-md">
          ส่งออเดอร์เข้า LINE 🟢
        </button>
      </div>
    </div>
  </div>

  <script>
    let cart = {};

    function addToCart(name, price) {
      if (!cart[name]) {
        cart[name] = { price: price, qty: 1 };
      } else {
        cart[name].qty += 1;
      }
      updateCartUI();
    }

    function updateCartUI() {
      let totalQty = 0;
      let totalPrice = 0;
      let container = document.getElementById('cart-items');
      container.innerHTML = '';

      for (let name in cart) {
        let item = cart[name];
        totalQty += item.qty;
        totalPrice += item.price * item.qty;

        let div = document.createElement('div');
        div.className = 'flex justify-between items-center border-b pb-2';
        div.innerHTML = `
          <div>
            <p class="font-semibold">${name}</p>
            <p class="text-xs text-gray-500">${item.price} x ${item.qty} = ${item.price * item.qty} บาท</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="changeQty('${name}', -1)" class="w-6 h-6 bg-gray-200 rounded-full font-bold">-</button>
            <span>${item.qty}</span>
            <button onclick="changeQty('${name}', 1)" class="w-6 h-6 bg-emerald-600 text-white rounded-full font-bold">+</button>
          </div>
        `;
        container.appendChild(div);
      }

      const badge = document.getElementById('cart-badge');
      const bottomBar = document.getElementById('bottom-bar');

      if (totalQty > 0) {
        badge.innerText = totalQty;
        badge.classList.remove('hidden');
        bottomBar.classList.remove('hidden');
        document.getElementById('total-price').innerText = totalPrice + ' ฿';
        document.getElementById('modal-total').innerText = totalPrice + ' ฿';
      } else {
        badge.classList.add('hidden');
        bottomBar.classList.add('hidden');
        closeCart();
      }
    }

    function changeQty(name, delta) {
      if (cart[name]) {
        cart[name].qty += delta;
        if (cart[name].qty <= 0) {
          delete cart[name];
        }
      }
      updateCartUI();
    }

    function openCart() {
      if (Object.keys(cart).length === 0) {
        alert('กรุณาเลือกรายการอาหารก่อนครับ');
        return;
      }
      document.getElementById('cart-modal').classList.remove('hidden');
    }

    function closeCart() {
      document.getElementById('cart-modal').classList.add('hidden');
    }

    function sendToLine() {
      let text = "🛒 *ออเดอร์สั่งอาหาร*\n\n";
      let total = 0;
      let i = 1;

      for (let name in cart) {
        let item = cart[name];
        let subtotal = item.price * item.qty;
        total += subtotal;
        text += `${i}. ${name} x${item.qty} = ${subtotal} บาท\n`;
        i++;
      }

      text += `\n💰 *ยอดรวมสุทธิ: ${total} บาท*`;
      let note = document.getElementById('note-text').value;
      if (note) text += `\n📝 *หมายเหตุ:* ${note}`;

      window.location.href = `https://line.me/R/msg/text/?${encodeURIComponent(text)}`;
    }
  </script>
</body>
</html>
